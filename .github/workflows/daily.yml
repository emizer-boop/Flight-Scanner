name: Daily Skyscanner Tracker

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          RAPIDAPI_KEY: $ secrets.RAPIDAPI_KEY 
        run: python tracker.py

      - name: Find today's report
        id: report
        run: |
          REPORT_FILE=$(ls -1 reports/*.md | sort | tail -n 1)
          echo "file=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "title=Skyscanner feed - $(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Post daily feed as an Issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: $ steps.report.outputs.title 
          content-filepath: $ steps.report.outputs.file 
          labels: skyscanner-feed

      - name: Commit price history and report
        run: |
          git config user.name "skyscanner-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.db reports/ || true
          git diff --staged --quiet || git commit -m "daily run $(date -u +%Y-%m-%d)"
          git push || true
